name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  check-and-build:
    name: Lint, Format, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Same gate agents run locally: lint, format, build, unit and e2e tests.
      - run: npm run verify
      - run: npm audit
