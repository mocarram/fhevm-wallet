name: Deploy site to GitHub Pages

# Publishes the static website in site/ to GitHub Pages. The site is plain HTML, CSS and
# JS with no build step, so the job uploads site/ as the Pages artifact and deploys it.
# Runs when the site (or this workflow) changes on staging, or by hand.
#
# One-time setup: in the repo Settings -> Pages, set "Source" to "GitHub Actions".
# After that the site is served at https://mocarram.github.io/fhevm-wallet/.

on:
  push:
    branches: [staging]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# What deploy-pages needs to publish through OIDC; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned by commit, like ci.yml.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
