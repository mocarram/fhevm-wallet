services:
  fhevm-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    image: fhevm-wallet:latest
    container_name: fhevm-wallet
    stdin_open: true
    tty: true
    # Optional overrides (RPC URLs, API keys). Settings saved from inside the wallet
    # are stored in the data volume instead, with owner-only permissions.
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist wallet data and configuration. The container runs as the "node"
      # user, uid 1000: ./data must exist and be owned by uid 1000 on the host
      # (`make data-dir` creates it; if Docker creates it, it is owned by root).
      - ./data:/data
    networks:
      - fhe-network

networks:
  fhe-network:
    driver: bridge
