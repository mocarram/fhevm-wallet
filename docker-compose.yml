services:
  fhevm-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    image: fhevm-wallet:latest
    container_name: fhevm-wallet
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      # Persist wallet data and configuration
      - ./data:/app/data
    networks:
      - fhe-network

networks:
  fhe-network:
    driver: bridge
